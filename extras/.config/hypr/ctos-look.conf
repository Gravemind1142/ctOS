# GENERATED by design/build.py from design/templates/extras/.config/hypr/ctos-look.conf.tmpl.
# Do not edit by hand. Change design/tokens.json or the template and run design/build.py.
#
# ctOS window look: square, outlined, opaque windows that tile with a narrow gutter
# (DESIGN.md -> Shape, Motion). Source this AFTER your own settings so it wins:
#   source = /opt/ctos/extras/.config/hypr/ctos-look.conf

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8

    # solid colours, no gradients
    col.active_border = rgb(d9d9d9)
    col.inactive_border = rgb(7a7a7a)
}

decoration {
    rounding = 0

    # depth comes from outlines, not shadows; surfaces are opaque
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

# tabbed groups: tabs follow the controls spec (active tab is an inverted block)
group {
    col.border_active = rgb(d9d9d9)
    col.border_inactive = rgb(7a7a7a)
    col.border_locked_active = rgb(d9d9d9)
    col.border_locked_inactive = rgb(7a7a7a)

    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        height = 20
        gradients = true
        rounding = 0
        gradient_rounding = 0
        indicator_height = 0
        col.active = rgb(e0e0e0)
        col.inactive = rgb(151a20)
        text_color = rgb(000000)
        text_color_inactive = rgb(7a7a7a)
    }
}

# speeds are in deciseconds; curves come from the easing tokens
animations {
    enabled = true

    bezier = ctosEnter, 0.33, 1, 0.68, 1
    bezier = ctosExit, 0.7, 0, 0.84, 0
    bezier = ctosMove, 0.65, 0, 0.35, 1
    bezier = ctosSnap, 0.16, 1, 0.3, 1
    bezier = ctosLinear, 0, 0, 1, 1

    animation = global, 1, 3, ctosMove
    animation = border, 1, 1, ctosLinear
    animation = windowsIn, 1, 2, ctosEnter, popin 95%
    animation = windowsOut, 1, 1, ctosExit, popin 95%
    animation = windowsMove, 1, 3, ctosMove
    animation = fadeIn, 1, 2, ctosEnter
    animation = fadeOut, 1, 1, ctosExit
    animation = fade, 1, 2, ctosMove
    animation = layersIn, 1, 2, ctosEnter, fade
    animation = layersOut, 1, 1, ctosExit, fade
    animation = workspaces, 1, 3, ctosMove, slide
}
